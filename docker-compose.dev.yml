services:
  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    volumes:
      - mongo_data_dev:/data/db
    ports:
      - "27017:27017"   # exposed so you can connect with MongoDB Compass
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules   # prevents host node_modules from overwriting the container's
    env_file: ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/Safar
      - PORT=3000
      - NODE_ENV=development
      - APP_BASE_URL=http://localhost:5173
      - COOKIE_DOMAIN=
      - COOKIE_SECURE=false
      - ADMIN_NAME=Admin User
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@safar.com
      - ADMIN_PASSWORD=Admin@123
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules   # prevents host node_modules from overwriting the container's
    env_file: ./frontend/.env
    environment:
      - BACKEND_URL=http://backend:3000   # used by vite.config.ts proxy (server-side)
      - VITE_API_BASE_URL=/api            # overrides the .env value; browser uses relative /api
    ports:
      - "0.0.0.0:5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data_dev:
