name: CI/CD

on:
  push:
    branches: [Safar-react]
  pull_request:
    branches: [Safar-react, main]

jobs:
  # ── Security: Trivy vulnerability, secret, and config scan ─────────────────
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload SARIF to GitHub Security tab

    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          format: 'sarif'
          output: 'trivy-vuln.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Upload vulnerability results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-vuln.sarif'
          category: 'trivy-vuln'

      - name: Scan Dockerfiles and Compose for misconfigurations
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'          # advisory only — does not block deploy

      - name: Upload config results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  # ── CI: verify the build is healthy ────────────────────────────────────────
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_API_BASE_URL: /api

  # ── CD: deploy to EC2 (push to Safar-react only) ───────────────────────────
  deploy:
    name: Deploy to EC2
    needs: [ci, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "$HOME/safar"
            git pull origin Safar-react
            sudo docker compose up --build -d

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Waiting 30s for containers to start..."
            sleep 30
            cd "$HOME/safar"
            echo "--- Container status ---"
            sudo docker compose ps
            echo "--- Backend health ---"
            curl -sf http://localhost:3000/health && echo " OK" || echo " WARNING: backend not yet healthy (may still be starting)"
