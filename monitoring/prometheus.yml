global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host system metrics (CPU, memory, disk, network)
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: safar-ec2

  # Safar Node.js backend — application metrics
  # Prometheus reaches backend:3000 directly inside Docker network.
  # nginx never exposes /metrics externally, so this is safe.
  - job_name: safar-backend
    static_configs:
      - targets: ['backend:3000']
        labels:
          app: safar
    metrics_path: /metrics
